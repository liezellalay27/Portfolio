<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liezel A. Ybañez | Project Manager &amp; Frontend Developer</title>
    <meta name="description" content="Portfolio of Liezel A. Ybañez, a project manager and frontend developer from Cebu City, Philippines." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  </head>
  <body>
    <nav class="site-nav" aria-label="Main navigation">
      <div class="container nav-inner">
        <a class="brand-mark" href="#top" aria-label="Liezel home">L<span>.</span></a>
        <div class="nav-links">
          <a href="#about">About</a>
          <a href="#projects">Work</a>
          <a href="#contact">Contact</a>
        </div>
      </div>
    </nav>
    {% block content %}{% endblock %}
    <script>
      const modal = document.querySelector('#project-modal');
      const modalName = document.querySelector('#modal-project-name');
      const modalCategory = document.querySelector('#modal-project-category');
      const modalDetails = document.querySelector('#modal-project-details');
      const modalStack = document.querySelector('#modal-project-stack');
      let lastTrigger;

      document.querySelectorAll('.project-card').forEach((card) => {
        card.addEventListener('click', () => {
          lastTrigger = card;
          modalName.textContent = card.dataset.projectName;
          modalCategory.textContent = card.dataset.projectCategory;
          modalDetails.textContent = card.dataset.projectDetails;
          modalStack.replaceChildren(...card.dataset.projectStack.split(', ').map((item) => {
            const tag = document.createElement('span');
            tag.textContent = item;
            return tag;
          }));
          modal.classList.add('is-open');
          modal.setAttribute('aria-hidden', 'false');
          document.body.classList.add('modal-open');
          modal.querySelector('.modal-close').focus();
        });
      });

      function closeModal() {
        modal.classList.remove('is-open');
        modal.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('modal-open');
        lastTrigger?.focus();
      }

      document.querySelectorAll('[data-close-modal]').forEach((element) => element.addEventListener('click', closeModal));
      document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && modal.classList.contains('is-open')) closeModal(); });
    </script>
  </body>
</html>
